# TLS terminates at the remote HAProxy. Only that proxy and local checks enter here.
server {
    listen 8080 default_server;
    server_name ia.mes.gob.cu;
    server_tokens off;
    allow 10.46.4.22;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/ia-es.access.log;
    error_log /var/log/nginx/ia-es.error.log warn;

    location = /api/health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host ia.mes.gob.cu;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
